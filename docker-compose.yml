services:

  api1:
    image: ghcr.io/marcoant007/rinha-backend-2026-api:v6
    environment:
      - PORT=8081
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "165MB"

  api2:
    image: ghcr.io/marcoant007/rinha-backend-2026-api:v6
    environment:
      - PORT=8081
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "165MB"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "9999:9999"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - backend
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: "10MB"

networks:
  backend:
    driver: bridge
