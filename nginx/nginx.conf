worker_processes 1;

events {
    worker_connections 4096;
}

http {
    upstream api {
        server api1:8081;
        server api2:8081;
        keepalive 64;
    }

    server {
        listen 9999;

        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
